version: '3.9'

services:
  # Base de données MySQL
  mysql:
    image: mysql:8.0
    container_name: glpi_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - ./volumes/mysql:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - glpi_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application GLPI
  glpi:
    image: glpi:${GLPI_VERSION}
    build:
      context: ./docker
      dockerfile: Dockerfile.glpi
    container_name: glpi_app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      GLPI_TIMEZONE: ${GLPI_TIMEZONE}
      GLPI_LANG: ${GLPI_LANG}
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./volumes/glpi:/var/www/glpi
      - ./docker/glpi/glpi_plugins:/var/www/glpi/plugins
    networks:
      - glpi_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/glpi/status.php"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Serveur Web Nginx
  nginx:
    image: nginx:latest
    container_name: glpi_nginx
    restart: unless-stopped
    depends_on:
      - glpi
    ports:
      - "${NGINX_PORT}:80"
      - "${NGINX_SSL_PORT}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/glpi.conf:/etc/nginx/conf.d/glpi.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl
    networks:
      - glpi_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  glpi_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  glpi_data:
    driver: local
