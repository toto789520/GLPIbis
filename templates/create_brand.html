{% extends 'base.html' %}

{% block title %}Créer une Marque{% endblock %}

{% block content %}
<h1>Créer une Marque</h1>

<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
    
    <div class="mb-3">
        <label for="name" class="form-label">Nom de la marque *</label>
        <input type="text" class="form-control" id="name" name="name" required>
    </div>

    <div class="mb-3">
        <label for="tel" class="form-label">Téléphone</label>
        <input type="number" class="form-control" id="tel" name="tel">
    </div>

    <div class="mb-3">
        <label for="nb_customer" class="form-label">Nombre de clients</label>
        <input type="number" class="form-control" id="nb_customer" name="nb_customer">
    </div>

    <button type="submit" class="btn btn-primary">Créer</button>
    <a href="{{ url_for('brands') }}" class="btn btn-secondary">Annuler</a>
</form>
{% endblock %}
